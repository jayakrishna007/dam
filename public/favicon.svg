<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="homepage-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="drop-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <radialGradient id="cyan-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Cyan Backdrop Glow -->
  <rect width="512" height="512" rx="140" fill="url(#cyan-glow)" />

  <!-- Main Rounded Tile (Matches Homepage Logo Badge) -->
  <rect x="32" y="32" width="448" height="448" rx="120" fill="url(#homepage-bg)" filter="url(#glow-blur)" />
  <rect x="36" y="36" width="440" height="440" rx="116" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6" />

  <!-- Clean Water Drop Symbol (Emoji / Vector 💧) -->
  <g transform="translate(256, 240)">
    <path d="M 0 -130 C 65 -40, 110 30, 110 85 C 110 145, 60 195, 0 195 C -60 195, -110 145, -110 85 C -110 30, -65 -40, 0 -130 Z" fill="url(#drop-fill)" />
    <!-- Glossy Highlight -->
    <path d="M -30 -30 C -15 -60, 0 -80, 0 -80 C 0 -80 -25 -40 -35 0 C -42 28, -35 60, -35 60 C -35 60 -55 35 -48 5 C -44 -15, -35 -25, -30 -30 Z" fill="#FFFFFF" opacity="0.6" />
  </g>
</svg>